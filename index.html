<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Huninn&family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Writter</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/composer.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/text-swap.css">
<link rel="stylesheet" href="css/exit-animations.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand">Writter</span>
      <button class="toggle" id="toggleSidebar" title="Toggle sidebar" aria-label="Toggle sidebar">
        <span class="material-symbols-outlined">dock_to_right</span>
      </button>
    </div>

    <nav class="section-list" id="sectionList"></nav>

    <div class="sidebar-bottom">
      <button class="new-section" id="newSection" title="New section">
        <span class="material-symbols-outlined">add</span>
        <span class="new-section-label">New section</span>
      </button>
      <button class="new-section" id="openSettings" title="Settings">
        <span class="material-symbols-outlined">settings</span>
        <span class="new-section-label">Settings</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="section-title" id="sectionTitle">All</span>
      <div class="save-state" id="saveState"><span class="t-text-swap">Saved</span></div>
    </header>

    <section class="feed" id="feed">
      <div class="feed-inner" id="feedInner"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Write anything..." aria-label="Your writing"></textarea>
        <button type="submit" class="round send disabled" id="send" title="Save" aria-label="Save">
          <span class="material-symbols-outlined">arrow_upward</span>
        </button>
      </form>
      <span class="hint">⌘ / Ctrl + Enter</span>
    </div>
  </main>
</div>

<!-- Section modal -->
<div class="modal-layer" id="modalLayer">
  <div class="modal">
    <h2 id="modalTitle">New section</h2>
    <input id="modalInput" class="modal-input" maxlength="28" placeholder="e.g. Characters, ideas..." autocomplete="off">
    <p id="modalDescription" class="modal-desc"></p>
    <div class="modal-actions">
      <button class="cancel" id="cancelModal">Cancel</button>
      <button class="confirm" id="confirmModal">Create</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="settings-layer" id="settingsLayer">
  <div class="settings">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="settings-close" id="settingsClose" title="Close" aria-label="Close settings">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="settings-body"></div>

    <div class="settings-footer">
      <button class="settings-reset" id="settingsReset">Reset to default</button>
      <button class="settings-save" id="settingsSaveBtn">Save</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
